[package]
name = "spurx-ipcalc"
version = "0.1.0"
edition = "2021"
authors = ["Spurx"]
description = "A fast, cross-platform CLI subnet calculator for IPv4 and IPv6"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "spurx_ipcalc"
path = "src/lib.rs"

[[bin]]
name = "spurx-ipcalc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
ipnet = { version = "2.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
